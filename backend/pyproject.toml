[project]
name = "enterprise-ai-backend"
version = "0.1.0"
description = "Portable Enterprise AI & RAG Platform - Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.0",
    "psycopg-pool>=3.1",
    "pydantic>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=2.1",
    "python-multipart>=0.0",
    "pyjwt>=2.8",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
    "openai>=1.0",
    "PyPDF2>=3.0",
    "python-docx>=0.8",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "sqlparse>=0.5.0",
    "sqlglot>=25.0",
    "chardet>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
