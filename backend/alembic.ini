# Alembic configuration for Enterprise AI Platform

[alembic]
script_location = app/migrations/alembic
sqlalchemy.url = postgresql+psycopg://app_admin:changeme_dev@127.0.0.1:5433/enterprise_ai
prepend_sys_path = .
version_path_separator = os

[alembic:env]
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
